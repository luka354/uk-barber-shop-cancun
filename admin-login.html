<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UK Barber Shop Cancun — Admin Login</title><style>body{margin:0;background:#090909;color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(420px,100%);background:#131313;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:24px;box-sizing:border-box}.brand{display:flex;align-items:center;gap:12px}.brand img{width:64px;height:64px;border-radius:50%}h1{font-size:34px;margin:18px 0 8px}.muted{color:#8e8e8e;line-height:1.6}input{width:100%;box-sizing:border-box;background:#1a1a1a;border:1px solid rgba(255,255,255,.12);color:#fff;padding:13px;border-radius:10px;font-size:16px;margin:10px 0}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#c3a575;color:#111;font-weight:800;cursor:pointer}.err{min-height:20px;color:#ff8d8d;font-size:13px;margin-top:10px}a{color:#c3a575;text-decoration:none;font-size:13px}</style></head><body><div class="card"><div class="brand"><img src="assets/logo.png"><div><b>UK BARBER SHOP</b><div class="muted" style="font-size:12px">Cancún · Admin</div></div></div><h1>Admin access</h1><p class="muted">Enter the admin password to manage appointments.</p><input id="key" type="password" placeholder="Admin password"><button class="btn" id="login">Log in</button><div class="err" id="err"></div><a href="index.html">← Back to website</a></div><script>async function go(){const key=document.getElementById('key').value.trim(),e=document.getElementById('err');e.textContent='';if(!key){e.textContent='Enter the admin password.';return}try{const r=await fetch('/api/bookings?admin=1',{headers:{'x-admin-key':key}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Invalid password');sessionStorage.setItem('ukCancunAdminKey',key);location.href='admin.html'}catch(x){e.textContent=x.message}}document.getElementById('login').onclick=go;document.getElementById('key').addEventListener('keydown',e=>{if(e.key==='Enter')go()})</script></body></html>
