<style>

ound:rgba(173,67,67,.12);border:1px solid rgba(173,67,67,.35);color:#efadad}.msg.ok{display:block;background:rgba(91,181,112,.11);border:1px solid rgba(91,181,112,.32);color:#9fe0ae}.lock{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(185,138,86,.12);border:1px solid rgba(185,138,86,.28);font-size:21px;margin-bottom:16px}@media(max-width:520px){.card{padding:24px 18px}h1{font-size:48px}}

/* ===== RESPONSIVE V2 — fluid screens, no horizontal overflow ===== */
html,body{width:100%;max-width:100%;overflow-x:clip!important}
*,*::before,*::after{box-sizing:border-box}
img,svg,video,canvas{max-width:100%;height:auto}
input,select,textarea,button{max-width:100%;min-width:0}
a,button{overflow-wrap:anywhere}
\n@media(max-width:560px){body{padding:12px!important}.shell,.card,.box{width:100%!important;max-width:100%!important}.card,.box{padding:20px 16px!important}h1{font-size:clamp(38px,13vw,52px)!important}.btn,button{width:100%!important}}

.arsa-login-logo{display:block;width:118px;height:auto;margin:0 auto 16px;object-fit:contain;filter:drop-shadow(0 12px 28px rgba(0,0,0,.4))}
</style>

    <div class="kicker">Pristup vlasnika</div>
    <h1>ADMIN PRIJAVA</h1>
    <p class="muted">Unesi privatnu lozinku vlasnika da otvoriš kalendar i rezervacije klijenata.</p>
    <form id="loginForm">
      <div class="field"><label for="adminPassword">Admin lozinka</label><div class="pw-wrap"><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Unesi admin lozinku" required><button type="button" class="eye" id="togglePw" aria-label="Show password">👁</button></div></div>
      <button class="btn" id="loginBtn" type="submit">Prijavi se</button>
      <div class="msg" id="msg"></div>
    </form>
    <a class="back" href="./">← Nazad na javni sajt</a>
  </div>
</div>
<script>
const form=document.getElementById('loginForm'),pw=document.getElementById('adminPassword'),btn=document.getElementById('loginBtn'),msg=document.getElementById('msg');
document.getElementById('togglePw').onclick=()=>{pw.type=pw.type==='password'?'text':'password'};
const q=new URLSearchParams(location.search);if(q.get('error')==='session'){msg.className='msg err';msg.textContent='Admin sesija je istekla. Prijavi se ponovo.'}
form.addEventListener('submit',async e=>{e.preventDefault();const key=pw.value.trim();if(!key)return;btn.disabled=true;btn.textContent='Proveravam...';msg.className='msg';msg.textContent='';try{const r=await fetch('/api/bookings?admin=1',{method:'GET',headers:{'x-admin-key':key}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Pogrešna lozinka');sessionStorage.setItem('arsaAdminKey',key);msg.className='msg ok';msg.textContent='Prijava uspešna. Otvaram admin kalendar...';setTimeout(()=>location.href='admin.html',350)}catch(err){sessionStorage.removeItem('arsaAdminKey');msg.className='msg err';msg.textContent=err.message==='Invalid admin password'?'Pogrešna admin lozinka. Pokušaj ponovo.':(err.message||'Nije moguće povezivanje sa admin backendom.');btn.disabled=false;btn.textContent='Prijavi se'}});
</script>
