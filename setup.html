<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UK Barber Shop Cancun — Connection Check</title><style>body{margin:0;background:#090909;color:#fff;font-family:Inter,Arial,sans-serif;padding:40px 16px}.wrap{width:min(720px,100%);margin:auto}.card{background:#131313;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:20px}.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.1)}.ok{color:#66d47c}.bad{color:#ff8d8d}.opt{color:#e7bb69}a{color:#c3a575}</style></head><body><div class="wrap"><h1>UK BARBER SHOP CANCÚN — CONNECTION CHECK</h1><p>This page only checks whether the server can see the required configuration.</p><div class="card" id="card">Loading…</div><p><a href="index.html">Open website</a> · <a href="admin-login.html">Admin login</a></p></div><script>fetch('/api/bookings?health=1').then(r=>r.json()).then(d=>{const rows=[['Supabase database',d.databaseConfigured],['Resend email',d.emailConfigured],['Site URL',d.siteUrlConfigured],['Admin password',d.adminConfigured],['Owner email notification',d.ownerEmailConfigured,'optional']];document.getElementById('card').innerHTML=rows.map(x=>`<div class="row"><span>${x[0]}</span><b class="${x[1]?'ok':x[2]?'opt':'bad'}">${x[1]?'CONNECTED':x[2]?'OPTIONAL':'NOT CONNECTED'}</b></div>`).join('')+`<div class="row"><span>Email sender</span><b>${d.from||'—'}</b></div>`}).catch(e=>document.getElementById('card').textContent=e.message)</script></body></html>
