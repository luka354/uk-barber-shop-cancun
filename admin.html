<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UK Barber Shop Cancun — Admin</title><style>:root{--bg:#090909;--card:#151515;--gold:#c3a575;--line:rgba(255,255,255,.1);--muted:#8b8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(9,9,9,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{width:min(1400px,calc(100% - 28px));margin:auto;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;border-radius:50%}.brand b{font-size:18px}.btn{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#171717;color:#fff;font-weight:800;cursor:pointer}.btn.gold{background:var(--gold);color:#111}.wrap{width:min(1400px,calc(100% - 28px));margin:auto;padding:26px 0 80px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}h1{font-size:clamp(34px,5vw,62px);margin:0}.muted{color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{min-width:260px}.filters input,.modal input,.modal select,.modal textarea,.drawer select{background:#171717;border:1px solid var(--line);color:#fff;padding:11px;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.stat span{display:block;color:#777;font-size:10px;letter-spacing:.1em}.stat b{display:block;font-size:32px;margin-top:6px}.calendar{background:#111;border:1px solid var(--line);border-radius:18px;padding:16px}.calhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px}.week{display:grid;grid-template-columns:76px repeat(7,minmax(130px,1fr));min-width:1000px}.cell{min-height:84px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px}.headcell{min-height:auto;background:#0d0d0d;text-align:center;padding:11px;color:#aaa;font-size:10px}.time{display:flex;justify-content:center;padding-top:10px;color:#666;font-size:10px;background:#0d0d0d}.slot{min-height:72px;background:#161616;border:1px solid transparent;border-radius:8px;padding:6px;cursor:pointer}.slot:hover{border-color:var(--gold)}.slot.off{opacity:.22;cursor:not-allowed}.appt{height:100%;background:#1d1913;border-left:3px solid var(--gold);border-radius:7px;padding:7px}.appt b{display:block;font-size:11px}.appt span{display:block;font-size:9px;color:#aaa;margin-top:3px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);display:none;place-items:center;padding:14px;z-index:50}.modal.show{display:grid}.box{width:min(560px,100%);max-height:92vh;overflow:auto;background:#111;border:1px solid var(--line);border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.grid input,.grid select,.grid textarea{width:100%}.close{float:right}.drawer{position:fixed;top:0;right:-470px;width:min(460px,100%);height:100vh;background:#0f0f0f;border-left:1px solid var(--line);z-index:60;padding:22px;transition:.3s;overflow:auto}.drawer.show{right:0}.drow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.drow span{color:#777}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}@media(max-width:760px){.topin,.wrap{width:calc(100% - 16px)}.topin{min-height:66px}.brand b{font-size:14px}.stats{grid-template-columns:1fr 1fr}.head{align-items:stretch}.filters{display:grid;grid-template-columns:1fr;width:100%}.filters input{min-width:0;width:100%}.calhead{align-items:stretch;flex-direction:column}.calhead>div:last-child{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.drawer{width:100%;max-width:100vw}.actions{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="topin"><div class="brand"><img src="assets/logo.png"><div><b>UK BARBER SHOP CANCÚN</b><div class="muted" style="font-size:11px">Appointment admin</div></div></div><div><a class="btn" href="index.html">Website</a> <button class="btn" id="logout">Log out</button></div></div></header><main class="wrap"><div class="head"><div><div class="muted">Who is coming and when?</div><h1>APPOINTMENT CALENDAR</h1></div><div class="filters"><input id="search" placeholder="Search name, phone, service…"><button class="btn gold" id="newBtn">+ New appointment</button></div></div><div class="stats"><div class="stat"><span>TODAY</span><b id="sToday">0</b></div><div class="stat"><span>THIS WEEK</span><b id="sWeek">0</b></div><div class="stat"><span>FREE TODAY</span><b id="sFree">0</b></div><div class="stat"><span>COMPLETED</span><b id="sDone">0</b></div></div><section class="calendar"><div class="calhead"><div><b id="range" style="font-size:24px"></b><div class="muted" style="font-size:12px">Tap an empty slot to add a booking.</div></div><div><button class="btn" id="prev">←</button><button class="btn" id="today">Today</button><button class="btn" id="next">→</button></div></div><div class="scroll"><div class="week" id="week"></div></div></section></main><div class="modal" id="newModal"><div class="box"><button class="btn close" id="closeNew">✕</button><h2>New appointment</h2><p class="muted" id="newWhen"></p><div class="grid"><input id="aName" placeholder="Client name"><input id="aPhone" placeholder="Phone"><input id="aEmail" placeholder="Email"><select id="aService"><option>Signature Haircut</option><option>Fade & Taper</option><option>Beard Detail</option><option>Haircut + Beard</option></select><select id="aStatus"><option>Confirmed</option><option>Pending</option><option>In Chair</option><option>Completed</option><option>No Show</option><option>Cancelled</option></select><textarea id="aNotes" class="full" rows="3" placeholder="Notes"></textarea><button class="btn gold full" id="saveNew">Save appointment</button></div></div></div><aside class="drawer" id="drawer"><button class="btn" id="closeDrawer">✕</button><h2 id="dName"></h2><div id="details"></div><p>Status</p><select id="dStatus" style="width:100%"><option>Pending</option><option>Confirmed</option><option>In Chair</option><option>Completed</option><option>No Show</option><option>Cancelled</option></select><div class="actions"><button class="btn gold" id="saveStatus">Save status</button><button class="btn" id="deleteAppt">Delete</button></div></aside><script>
const $=s=>document.querySelector(s);const key=sessionStorage.getItem('ukCancunAdminKey')||'';if(!key)location.replace('admin-login.html');let bookings=[],monday=startMonday(new Date()),selDate='',selTime='',activeId=null;function api(body){return fetch('/api/bookings?admin=1',{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-admin-key':key},body:body?JSON.stringify(body):undefined}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d})}function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function startMonday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}function nice(d){return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}function niceLong(k){return parseKey(k).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}function add45(t){let[h,m]=t.split(':').map(Number),x=h*60+m+45;return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`}function makeTimes(start,end){const a=[];for(let x=start;x+45<=end;x+=45)a.push(`${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`);return a}function timesFor(d){return d.getDay()===0?makeTimes(600,1020):makeTimes(540,1200)}const allTimes=makeTimes(540,1200);function cancunNow(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Cancun',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),v={};p.forEach(x=>{if(x.type!=='literal')v[x.type]=x.value});return{key:`${v.year}-${v.month}-${v.day}`,min:+v.hour*60+(+v.minute)}}function past(k,t){const n=cancunNow();if(k<n.key)return true;if(k>n.key)return false;const[h,m]=t.split(':').map(Number);return h*60+m<=n.min}function active(b){return !['Cancelled','No Show'].includes(b.status)}function isBooked(k,t,id){return bookings.some(b=>String(b.id)!==String(id||'')&&b.date===k&&b.time===t&&active(b))}async function load(){try{const d=await api();bookings=d.bookings||[];render()}catch(e){sessionStorage.removeItem('ukCancunAdminKey');alert(e.message);location.replace('admin-login.html')}}function filtered(){const q=$('#search').value.toLowerCase();return bookings.filter(b=>!q||`${b.name||''} ${b.phone||''} ${b.service||''}`.toLowerCase().includes(q))}function render(){const days=[0,1,2,3,4,5,6].map(i=>addDays(monday,i));$('#range').textContent=`${nice(days[0])} — ${nice(days[6])}`;const w=$('#week');w.innerHTML='<div class="cell headcell"></div>'+days.map(d=>`<div class="cell headcell">${nice(d).toUpperCase()}</div>`).join('');for(const t of allTimes){w.insertAdjacentHTML('beforeend',`<div class="cell time">${t}</div>`);for(const d of days){const k=dateKey(d),allowed=timesFor(d).includes(t),p=past(k,t),b=filtered().find(x=>x.date===k&&x.time===t&&active(x));const c=document.createElement('div');c.className='cell';const s=document.createElement('div');s.className='slot'+(!allowed||p?' off':'');if(b){s.innerHTML=`<div class="appt"><b>${t} · ${b.name}</b><span>${b.service}</span><span>${b.status}</span></div>`;s.onclick=()=>openDrawer(b.id)}else if(allowed&&!p){s.innerHTML='<span class="muted" style="font-size:10px">+ ADD</span>';s.onclick=()=>openNew(k,t)}c.appendChild(s);w.appendChild(c)}}stats(days)}function stats(days){const n=cancunNow(),today=n.key;$('#sToday').textContent=bookings.filter(b=>b.date===today&&active(b)).length;const ks=days.map(dateKey);$('#sWeek').textContent=bookings.filter(b=>ks.includes(b.date)&&active(b)).length;$('#sDone').textContent=bookings.filter(b=>b.status==='Completed').length;const td=parseKey(today);$('#sFree').textContent=timesFor(td).filter(t=>!past(today,t)&&!isBooked(today,t)).length}function openNew(k,t){selDate=k;selTime=t;$('#newWhen').textContent=`${niceLong(k)} · ${t}–${add45(t)}`;$('#aName').value=$('#aPhone').value=$('#aEmail').value=$('#aNotes').value='';$('#newModal').classList.add('show')}$('#closeNew').onclick=()=>$('#newModal').classList.remove('show');$('#newBtn').onclick=()=>{for(let i=0;i<30;i++){const d=addDays(new Date(),i),k=dateKey(d);for(const t of timesFor(d))if(!past(k,t)&&!isBooked(k,t))return openNew(k,t)}};$('#saveNew').onclick=async()=>{const b={name:$('#aName').value.trim(),phone:$('#aPhone').value.trim(),email:$('#aEmail').value.trim(),service:$('#aService').value,status:$('#aStatus').value,notes:$('#aNotes').value.trim(),date:selDate,time:selTime};if(!b.name||!b.phone){alert('Enter client name and phone.');return}try{await api({action:'adminCreate',booking:b});$('#newModal').classList.remove('show');await load()}catch(e){alert(e.message)}};function openDrawer(id){activeId=id;const b=bookings.find(x=>String(x.id)===String(id));if(!b)return;$('#dName').textContent=b.name;$('#details').innerHTML=[['Phone',b.phone],['Email',b.email||'—'],['Service',b.service],['Date',niceLong(b.date)],['Time',`${b.time}–${add45(b.time)}`],['Notes',b.notes||'—']].map(x=>`<div class="drow"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#dStatus').value=b.status;$('#drawer').classList.add('show')}$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('show');$('#saveStatus').onclick=async()=>{try{await api({action:'adminUpdate',id:activeId,patch:{status:$('#dStatus').value}});$('#drawer').classList.remove('show');await load()}catch(e){alert(e.message)}};$('#deleteAppt').onclick=async()=>{if(!confirm('Delete this appointment?'))return;try{await api({action:'adminDelete',id:activeId});$('#drawer').classList.remove('show');await load()}catch(e){alert(e.message)}};$('#prev').onclick=()=>{monday=addDays(monday,-7);render()};$('#next').onclick=()=>{monday=addDays(monday,7);render()};$('#today').onclick=()=>{monday=startMonday(new Date());render()};$('#search').oninput=render;$('#logout').onclick=()=>{sessionStorage.removeItem('ukCancunAdminKey');location.href='admin-login.html'};load();</script></body></html>
