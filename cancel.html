<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cancel Appointment — UK Barber Shop Cancun</title><style>body{margin:0;background:#090909;color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(560px,100%);background:#131313;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:24px;box-sizing:border-box;text-align:center}.brand{width:90px;height:90px;border-radius:50%;margin:0 auto 14px}.muted{color:#969696;line-height:1.6}.btn{border:0;border-radius:10px;padding:13px 18px;background:#c3a575;color:#111;font-weight:800;cursor:pointer}a{color:#c3a575;text-decoration:none}</style></head><body><div class="card"><img class="brand" src="assets/logo.png"><h1>Cancel appointment</h1><p class="muted" id="msg">Checking your booking…</p><button class="btn" id="cancel" style="display:none">Confirm cancellation</button><p><a href="index.html">Back to website</a></p></div><script>const q=new URLSearchParams(location.search),token=q.get('token'),msg=document.getElementById('msg'),btn=document.getElementById('cancel');if(!token){msg.textContent='This cancellation link is incomplete.'}else{msg.textContent='Press the button below to cancel this appointment.';btn.style.display='inline-block';btn.onclick=async()=>{btn.disabled=true;btn.textContent='Cancelling…';try{const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancelByToken',token})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not cancel appointment');msg.textContent='Your appointment has been cancelled. The time is available again.';btn.style.display='none'}catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent='Try again'}}}</script></body></html>
